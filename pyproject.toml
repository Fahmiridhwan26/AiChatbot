[project]
name = "faq-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-community>=0.4.2",
    "openai>=3.51.0",
    "pinecone>=7.3,<8",
    "pymupdf>=2.1",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
]

[project.scripts]
faq-chatbot = "faq_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
